; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = bloated_mp3_player

[env:bloated_mp3_player]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = arduino
monitor_speed = 115200
lib_deps = 
	adafruit/Adafruit NeoPixel@^1.15.5
	olikraus/U8g2@^2.36.0
    ; arduino-libhelix — see README.md → Dependencies → submodule setup
build_flags = 
	-Os
	-DBOARD_HAS_PSRAM
	-ffunction-sections
	-fdata-sections
	-Wl,--gc-sections
	-Wall -Wextra
	-Warray-bounds
	-Wno-unused-parameter
	-DPIO_FRAMEWORK_ARDUINO_CPP_NO_MAIN
    ; User-facing messages language. Pick exactly one:
    ;   -DMY_INFOS_LANG_EN   ; English (default, used when none defined)
    ;   -DMY_INFOS_LANG_IT   ; Italian
    ;   -DMY_INFOS_LANG_FR   ; French
    ; Bluetooth: the ESP32-S3 SDK's libbt.a has no classic-BT SPP/GAP symbols
    ; (only the controller + BLE GATTS/GAP), so BluetoothSerial can never
    ; link here -- the UART bridge uses the BLE nRF UART service instead,
    ; which links straight from the framework's own libbt.a. No extra flags.
lib_ldf_mode = chain
extra_scripts = pre:middleware/full_erase.py
build_src_filter = +<*> -<main.old.cpp>

[env:test]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = arduino
monitor_speed = 115200
test_framework = unity
lib_deps = 
	adafruit/Adafruit NeoPixel@^1.15.5
	olikraus/U8g2@^2.36.0
build_flags = 
	-Os
	-DBOARD_HAS_PSRAM
	-ffunction-sections
	-fdata-sections
	-Wl,--gc-sections
	-Wall -Wextra
	-Warray-bounds
	-Wno-unused-parameter
	-DPIO_FRAMEWORK_ARDUINO_CPP_NO_MAIN
lib_ldf_mode = chain
build_src_filter = +<*> -<main.old.cpp>
